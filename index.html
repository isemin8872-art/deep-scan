<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEEP SCAN | AI 이미지 분석</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 25px 15px;
  background: #0a1020;
  color: #edf2ff;
  font-family: Arial, sans-serif;
}
.container { max-width: 760px; margin: auto; }
header { text-align: center; margin: 30px 0; }
h1 { letter-spacing: 3px; font-size: 32px; }
h1 span { color: #64a5ff; }
.sub { color: #9aaac5; font-size: 14px; }
.panel {
  background: #141f35;
  border: 1px solid #293b5e;
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 18px;
}
.upload {
  border: 2px dashed #5276a8;
  border-radius: 15px;
  padding: 35px 15px;
  text-align: center;
  cursor: pointer;
  background: #101a2d;
}
.upload:hover { border-color: #70aaff; }
.upload strong { display: block; margin-bottom: 9px; }
input { display: none; }
button {
  border: 0;
  border-radius: 10px;
  padding: 13px 20px;
  cursor: pointer;
  font-weight: bold;
  font-size: 15px;
}
.primary {
  background: #397fe8;
  color: white;
  width: 100%;
  margin-top: 15px;
}
.primary:disabled { opacity: .45; cursor: not-allowed; }
.secondary { background: #293b5e; color: white; }
#preview {
  display: none;
  max-width: 100%;
  max-height: 350px;
  border-radius: 12px;
  margin: 20px auto 0;
}
#status { color: #9db7dc; text-align: center; margin-top: 15px; }
#result { display: none; }
.result-title { font-size: 21px; font-weight: bold; }
.score { font-size: 36px; font-weight: bold; margin: 12px 0; }
.bar-bg {
  height: 12px;
  background: #293b5e;
  border-radius: 20px;
  overflow: hidden;
  margin: 10px 0 20px;
}
.bar { height: 100%; width: 0; background: #4d9cff; transition: width .5s; }
.small { color: #9aaac5; font-size: 13px; line-height: 1.7; }
.warning {
  background: #332c1d;
  border: 1px solid #66542d;
  border-radius: 10px;
  padding: 13px;
  color: #f4d99a;
  font-size: 13px;
  line-height: 1.6;
}
footer { text-align: center; color: #788ba9; font-size: 12px; margin: 25px 0; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>DEEP <span>SCAN</span></h1>
    <p class="sub">AI 이미지와 실제 이미지 구분 도구</p>
  </header>

  <section class="panel">
    <h2>이미지 분석</h2>
    <label class="upload" for="file">
      <strong>이미지를 선택하세요</strong>
      <span class="small">JPG, PNG, WEBP 파일 지원</span>
      <img id="preview" alt="선택한 이미지 미리보기">
    </label>
    <input id="file" type="file" accept="image/png,image/jpeg,image/webp">
    <button id="analyze" class="primary" disabled>이미지 분석하기</button>
    <p id="status">이미지를 선택해 주세요.</p>
  </section>

  <section class="panel" id="result">
    <h2>분석 결과</h2>
    <p id="verdict" class="result-title"></p>
    <div id="score" class="score"></div>
    <p class="small">모델 점수</p>
    <div class="bar-bg"><div id="bar" class="bar"></div></div>
    <p id="detail" class="small"></p>
    <div class="warning">
      이 결과는 AI 모델의 추정입니다. 실제 이미지의 출처를 확정하지 못하며,
      얼굴 바꿔치기형 딥페이크를 전문적으로 판별하지 않습니다.
    </div>
  </section>

  <section class="panel">
    <h3>분석 안내</h3>
    <p class="small">
      DEEP SCAN은 이미지 분류 AI 모델을 사용합니다.
      이미지의 특징을 분석해 AI 생성 이미지인지 실제 촬영 이미지인지 추정합니다.
      편집, 압축, 새로운 생성 모델 등의 영향으로 오판할 수 있습니다.
    </p>
  </section>

  <footer>DEEP SCAN · Educational Project</footer>
</div>

<script type="module">
import { pipeline, env } from
  "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2";

env.allowLocalModels = false;
env.useBrowserCache = true;

const MODEL = "onnx-community/ai-image-detection-ONNX";

const fileInput = document.getElementById("file");
const preview = document.getElementById("preview");
const analyzeButton = document.getElementById("analyze");
const statusText = document.getElementById("status");
const resultBox = document.getElementById("result");

let selectedFile = null;
let detector = null;
let imageURL = null;

fileInput.addEventListener("change", () => {
  const file = fileInput.files[0];
  if (!file) return;

  if (!file.type.startsWith("image/")) {
    statusText.textContent = "이미지 파일만 선택할 수 있습니다.";
    return;
  }

  selectedFile = file;

  if (imageURL) URL.revokeObjectURL(imageURL);
  imageURL = URL.createObjectURL(file);

  preview.src = imageURL;
  preview.style.display = "block";

  resultBox.style.display = "none";
  analyzeButton.disabled = false;
  statusText.textContent = "이미지가 선택되었습니다.";
});

async function loadModel() {
  if (detector) return detector;

  statusText.textContent = "AI 모델을 불러오는 중입니다. 처음에는 시간이 걸릴 수 있습니다.";

  detector = await pipeline(
    "image-classification",
    MODEL,
    {
      dtype: "q4",
      device: "wasm",
      progress_callback: (progress) => {
        if (progress.status === "progress" &&
            Number.isFinite(progress.progress)) {
          statusText.textContent =
            "모델 다운로드 중: " +
            Math.round(progress.progress) + "%";
        } else if (progress.status === "done") {
          statusText.textContent = "모델 파일 준비 완료";
        }
      }
    }
  );

  return detector;
}

function isAI(label) {
  const name = label.toLowerCase();
  return name.includes("fake") ||
         name.includes("artificial") ||
         name.includes("synthetic") ||
         name.includes("ai-generated");
}

function isReal(label) {
  const name = label.toLowerCase();
  return name.includes("real") ||
         name.includes("human") ||
         name.includes("authentic");
}

analyzeButton.addEventListener("click", async () => {
  if (!selectedFile) return;

  analyzeButton.disabled = true;
  resultBox.style.display = "none";

  try {
    const model = await loadModel();

    statusText.textContent = "이미지를 분석하고 있습니다...";

    const predictions = await model(imageURL);

    if (!predictions || predictions.length < 2) {
      throw new Error("모델의 분석 결과를 가져오지 못했습니다.");
    }

    const aiResult = predictions.find(p => isAI(p.label));
    const realResult = predictions.find(p => isReal(p.label));

    if (!aiResult || !realResult) {
      throw new Error(
        "모델의 분류 이름을 확인할 수 없습니다: " +
        predictions.map(p => p.label).join(", ")
      );
    }

    const aiScore = aiResult.score;
    const realScore = realResult.score;
    const topScore = Math.max(aiScore, realScore);
    const difference = Math.abs(aiScore - realScore);

    let title;
    let explanation;

    if (topScore < 0.65 || difference < 0.15) {
      title = "판별 어려움";
      explanation = "두 분류의 점수가 충분히 구분되지 않습니다.";
    } else if (aiScore > realScore) {
      title = "AI 생성 이미지로 추정";
      explanation = "모델이 AI 생성 이미지에 더 높은 점수를 주었습니다.";
    } else {
      title = "실제 이미지로 추정";
      explanation = "모델이 실제 이미지에 더 높은 점수를 주었습니다.";
    }

    document.getElementById("verdict").textContent = title;
    document.getElementById("score").textContent =
      Math.round(topScore * 100) + "점";

    document.getElementById("bar").style.width =
      (topScore * 100) + "%";

    document.getElementById("detail").textContent =
      explanation +
      "\nAI 생성 점수: " + (aiScore * 100).toFixed(1) + "%" +
      "\n실제 이미지 점수: " + (realScore * 100).toFixed(1) + "%";

    resultBox.style.display = "block";
    statusText.textContent = "분석이 완료되었습니다.";

  } catch (error) {
    console.error(error);
    statusText.textContent =
      "분석 오류: " + error.message +
      " 인터넷 연결을 확인하고 다시 시도해 주세요.";
  } finally {
    analyzeButton.disabled = false;
  }
});
</script>
</body>
</html>
